<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--bg2:#0d1117;--card:#111820;--card2:#161e28;
  --border:#1e2d3d;--border2:#243548;
  --accent:#00d4ff;--accent2:#0099cc;--accent-dim:rgba(0,212,255,0.08);
  --green:#00ff88;--green-dim:rgba(0,255,136,0.08);
  --orange:#ff8c00;--orange-dim:rgba(255,140,0,0.1);
  --red:#ff3860;--red-dim:rgba(255,56,96,0.1);
  --yellow:#ffd700;--yellow-dim:rgba(255,215,0,0.1);
  --purple:#a855f7;--purple-dim:rgba(168,85,247,0.08);
  --text:#e8f4ff;--text2:#7a9bb5;--text3:#3d5a70;
  --r:16px;--rsm:10px;--rxs:7px;
}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:350px;height:350px;background:radial-gradient(circle,rgba(0,212,255,0.07),transparent 70%);top:-60px;right:-60px;}
.orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(0,255,136,0.05),transparent 70%);bottom:20%;left:-80px;}
.wrap{width:100%;max-width:520px;position:relative;z-index:1;}
.header{text-align:center;margin-bottom:20px;padding-top:8px;}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.logo-icon{width:44px;height:44px;background:var(--accent-dim);border:1px solid rgba(0,212,255,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.logo-icon i{font-size:22px;color:var(--accent);}
.logo-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.1em;color:var(--text);}
.logo-title span{color:var(--accent);}
.header-sub{font-size:12px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;}
.clock-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.clk-time{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);letter-spacing:0.08em;line-height:1;}
.clk-date{font-size:11px;color:var(--text3);margin-top:3px;}
.live-badge{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--green);letter-spacing:0.06em;text-transform:uppercase;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:livePulse 1.5s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,136,0.4)}50%{opacity:0.7;box-shadow:0 0 0 4px rgba(0,255,136,0);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:13px 8px;font-size:12px;font-weight:600;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;text-transform:uppercase;letter-spacing:0.05em;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text2);}
.sel-wrap{padding:28px 20px;text-align:center;}
.sel-wrap h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.08em;color:var(--text);margin-bottom:4px;}
.sel-wrap p{font-size:12px;color:var(--text3);margin-bottom:20px;}
.msn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.msn-btn{padding:14px 10px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .2s;text-align:center;}
.msn-btn:hover{border-color:var(--accent);background:var(--accent-dim);}
.mb-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--bg);margin:0 auto 8px;}
.mb-nm{font-size:13px;font-weight:600;color:var(--text);}
.st-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.st-left{display:flex;align-items:center;gap:10px;}
.st-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--bg);flex-shrink:0;}
.st-name{font-size:15px;font-weight:600;color:var(--text);}
.st-date{font-size:11px;color:var(--text3);margin-top:1px;}
.btn-chg{font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);padding:5px 10px;border-radius:99px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .2s;}
.btn-chg:hover{color:var(--accent);border-color:var(--accent);}
.st-body{padding:16px 18px;}
.cur-state{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--bg2);margin-bottom:12px;transition:all .4s;}
.cs-libre{border-color:rgba(0,255,136,0.3);background:var(--green-dim);}
.cs-ruta{border-color:rgba(0,212,255,0.3);background:var(--accent-dim);animation:glowBlue 2s ease-in-out infinite;}
.cs-proveedor{border-color:rgba(168,85,247,0.3);background:var(--purple-dim);animation:glowPurple 2s ease-in-out infinite;}
.cs-esperando{border-color:rgba(168,85,247,0.4);background:var(--purple-dim);animation:glowPurple 1.5s ease-in-out infinite;}
.cs-entregando{border-color:rgba(255,215,0,0.3);background:var(--yellow-dim);}
.cs-devolviendo{border-color:rgba(255,140,0,0.3);background:var(--orange-dim);}
.cs-late{border-color:rgba(255,56,96,0.4);background:var(--red-dim);}
@keyframes glowBlue{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0.1)}50%{box-shadow:0 0 16px 3px rgba(0,212,255,0.15)}}
@keyframes glowPurple{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,0.1)}50%{box-shadow:0 0 16px 3px rgba(168,85,247,0.15)}}
.cs-l{display:flex;align-items:center;gap:10px;}
.cs-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ic-libre{background:var(--green-dim);color:var(--green);}
.ic-ruta{background:var(--accent-dim);color:var(--accent);}
.ic-proveedor{background:var(--purple-dim);color:var(--purple);}
.ic-esperando{background:var(--purple-dim);color:var(--purple);}
.ic-entregando{background:var(--yellow-dim);color:var(--yellow);}
.ic-devolviendo{background:var(--orange-dim);color:var(--orange);}
.cs-lbl{font-size:16px;font-weight:700;color:var(--text);}
.cs-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.st-badge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.1em;padding:5px 12px;border-radius:99px;}
.sb-libre{background:rgba(0,255,136,0.12);color:var(--green);border:1px solid rgba(0,255,136,0.2);}
.sb-ruta{background:rgba(0,212,255,0.12);color:var(--accent);border:1px solid rgba(0,212,255,0.2);}
.sb-proveedor,.sb-esperando{background:rgba(168,85,247,0.12);color:var(--purple);border:1px solid rgba(168,85,247,0.2);}
.sb-entregando{background:rgba(255,215,0,0.12);color:var(--yellow);border:1px solid rgba(255,215,0,0.2);}
.sb-devolviendo{background:rgba(255,140,0,0.12);color:var(--orange);border:1px solid rgba(255,140,0,0.2);}
.ri-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 14px;margin-bottom:12px;}
.ri-row{display:flex;align-items:flex-start;justify-content:space-between;padding:5px 0;gap:8px;}
.ri-row:not(:last-child){border-bottom:1px solid var(--border);}
.ri-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ri-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--text);text-align:right;}
.c-accent{color:var(--accent);}.c-green{color:var(--green);}.c-orange{color:var(--orange);}.c-red{color:var(--red);}.c-purple{color:var(--purple);}
.cd-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 14px;margin-bottom:12px;}
.cd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cd-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.cd-time{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.05em;color:var(--accent);}
.cd-time.warn{color:var(--orange);}.cd-time.late{color:var(--red);}
.prog-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width 1s linear;}
.pf-ok{background:linear-gradient(90deg,var(--accent),var(--green));}.pf-warn{background:linear-gradient(90deg,var(--orange),var(--yellow));}.pf-late{background:var(--red);}
.wait-box{background:var(--purple-dim);border:1px solid rgba(168,85,247,0.2);border-radius:var(--rsm);padding:14px;margin-bottom:12px;text-align:center;}
.wait-lbl{font-size:10px;font-weight:600;color:var(--purple);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.wait-time{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--purple);letter-spacing:0.05em;}
.del-chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--rxs);margin-bottom:6px;font-size:12px;font-weight:600;}
.del-done{background:var(--green-dim);border:1px solid rgba(0,255,136,0.2);color:var(--green);}
.del-all{background:var(--green-dim);border:1px solid rgba(0,255,136,0.2);color:var(--green);border-radius:var(--rxs);padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;}
.act-btns{display:flex;flex-direction:column;gap:8px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:var(--rxs);font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-ruta{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);box-shadow:0 4px 20px rgba(0,212,255,0.2);}
.btn-proveedor{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;box-shadow:0 4px 20px rgba(168,85,247,0.2);}
.btn-esperar{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;}
.btn-entrega{background:linear-gradient(135deg,var(--yellow),#ffaa00);color:var(--bg);box-shadow:0 4px 20px rgba(255,215,0,0.2);}
.btn-volver{background:linear-gradient(135deg,var(--orange),#ff6600);color:var(--bg);box-shadow:0 4px 20px rgba(255,140,0,0.2);}
.btn-libre{background:linear-gradient(135deg,var(--green),#00cc66);color:var(--bg);box-shadow:0 4px 20px rgba(0,255,136,0.2);}
.btn-ghost{background:var(--card2);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-cam{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;box-shadow:0 4px 16px rgba(14,165,233,0.2);}
.late-banner{background:var(--red-dim);border:1px solid rgba(255,56,96,0.3);border-radius:var(--rxs);padding:10px 13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--red);}
/* Trip Config Form */
.form-wrap{padding:16px 18px;}
.form-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.08em;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.form-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;display:block;}
.section-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rsm);padding:12px 14px;margin-bottom:12px;}
.section-box.active-prov{border-color:rgba(168,85,247,0.4);background:var(--purple-dim);}
.section-box.active-route{border-color:rgba(0,212,255,0.3);background:var(--accent-dim);}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-hdr-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);}
.section-hdr-left i{font-size:16px;}
.toggle-btn{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--text3);transition:all .2s;}
.toggle-btn.on{background:var(--purple-dim);border-color:var(--purple);color:var(--purple);}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.zone-card{padding:9px 11px;border-radius:var(--rxs);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;transition:all .2s;}
.zone-card:hover{border-color:var(--accent);}
.zone-card.sel-c{border-color:var(--accent);background:var(--accent-dim);}
.zone-card.sel-p{border-color:var(--purple);background:var(--purple-dim);}
.zc-name{font-size:11px;font-weight:600;color:var(--text);}
.zc-time{font-size:10px;color:var(--accent);margin-top:1px;font-family:'JetBrains Mono',monospace;}
.zc-time.p{color:var(--purple);}
.dom-counter{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.dom-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dom-btn:hover{border-color:var(--accent);color:var(--accent);}
.dom-num{flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--accent);letter-spacing:0.05em;}
.dom-lbl{font-size:10px;color:var(--text3);text-align:center;margin-top:-4px;}
.summary-box{background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.15);border-radius:var(--rxs);padding:10px 13px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.6;}
.summary-box.has-data{border-color:rgba(0,212,255,0.25);color:var(--text);}
/* Photo */
.photo-thumb{width:100%;border-radius:var(--rxs);margin-bottom:8px;max-height:200px;object-fit:cover;border:1px solid var(--border);}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.photo-item{position:relative;border-radius:var(--rxs);overflow:hidden;aspect-ratio:1;border:1px solid var(--border);}
.photo-item img{width:100%;height:100%;object-fit:cover;}
.photo-item .ph-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);font-size:9px;color:#fff;padding:3px 5px;font-family:'JetBrains Mono',monospace;}
/* inputs */
input[type="text"],input[type="password"],textarea{width:100%;padding:11px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rxs);font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--text);outline:none;transition:border-color .2s;display:block;}
input:focus,textarea:focus{border-color:var(--accent);}
input[type="file"]{display:none;}
/* Admin */
.admin-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
.atab{padding:11px 12px;font-size:11px;font-weight:600;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:4px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;text-transform:uppercase;letter-spacing:0.06em;}
.atab.active{color:var(--accent);border-bottom-color:var(--accent);}
.atab:hover:not(.active){color:var(--text2);}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 10px;text-align:center;}
.metric-n{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;}
.metric-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;}
.adm-cards{padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.adm-card{border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--bg2);overflow:hidden;}
.adm-card.ac-libre{border-color:rgba(0,255,136,0.2);}
.adm-card.ac-ruta{border-color:rgba(0,212,255,0.25);animation:glowBlue 2.5s ease-in-out infinite;}
.adm-card.ac-proveedor,.adm-card.ac-esperando{border-color:rgba(168,85,247,0.3);}
.adm-card.ac-entregando{border-color:rgba(255,215,0,0.2);}
.adm-card.ac-devolviendo{border-color:rgba(255,140,0,0.25);}
.adm-card.ac-late{border-color:rgba(255,56,96,0.35);}
.ac-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
.ac-left{display:flex;align-items:center;gap:9px;}
.ac-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--bg);flex-shrink:0;}
.ac-name{font-size:14px;font-weight:700;color:var(--text);}
.ac-status{font-size:10px;color:var(--text3);margin-top:1px;}
.ac-body{padding:0 14px 12px;}
.ac-row{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);gap:8px;}
.ac-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;flex-shrink:0;}
.ac-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text);text-align:right;}
.ac-prog{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 4px;}
.ac-pf{height:100%;border-radius:99px;transition:width 1s linear;}
/* History filters */
.hist-wrap{padding:12px 14px;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.filter-sel{padding:7px 10px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rxs);font-size:12px;font-family:'Space Grotesk',sans-serif;color:var(--text);outline:none;cursor:pointer;flex:1;min-width:120px;}
.filter-sel:focus{border-color:var(--accent);}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dnav-btn{width:32px;height:32px;border-radius:var(--rxs);border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--text3);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dnav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.dnav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.dnav-lbl{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.today-chip{font-size:9px;background:var(--accent);color:var(--bg);padding:2px 7px;border-radius:99px;font-weight:700;}
.hist-table{border-radius:var(--rsm);overflow:hidden;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 8px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;background:var(--card2);border-bottom:1px solid var(--border);text-align:left;}
td{padding:8px 8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.td-chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:99px;font-family:'JetBrains Mono',monospace;display:inline-block;}
.ch-ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,255,136,0.2);}
.ch-warn{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,140,0,0.2);}
.ch-late{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,56,96,0.2);}
.ph-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.25);color:#38bdf8;font-size:10px;cursor:pointer;}
/* Settings */
.set-wrap{padding:14px;}
.set-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;margin-bottom:10px;}
.set-block h3{font-size:12px;font-weight:700;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.05em;}
.set-block h3 i{color:var(--accent);}
.connected-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid rgba(0,255,136,0.2);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--green);}
.setup-box{background:rgba(0,212,255,0.04);border:1.5px dashed rgba(0,212,255,0.2);border-radius:var(--rxs);padding:12px;margin-bottom:10px;font-size:11px;color:var(--text2);line-height:1.7;}
.setup-box a{color:var(--accent);text-decoration:none;}
.setup-box code{background:var(--card2);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);}
.in-row{display:flex;gap:7px;}.in-row input{flex:1;}
.btn-ic{width:42px;height:42px;flex-shrink:0;border-radius:var(--rxs);background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);font-size:18px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.login-wrap{padding:32px 20px;text-align:center;}
.login-icon{width:64px;height:64px;background:var(--accent-dim);border:1px solid rgba(0,212,255,0.25);border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.login-icon i{font-size:30px;color:var(--accent);}
.login-wrap h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.08em;color:var(--text);margin-bottom:4px;}
.login-wrap p{font-size:12px;color:var(--text3);margin-bottom:20px;}
/* Photo modal */
#ph-modal{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;padding:20px;}
#ph-modal.show{display:flex;}
#ph-modal img{max-width:100%;max-height:90vh;border-radius:var(--rsm);}
#ph-modal .close-btn{position:fixed;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.err{font-size:11px;color:var(--red);min-height:16px;margin:5px 0;}
.ok-msg{font-size:11px;color:var(--green);min-height:16px;margin:5px 0;}
.mt8{margin-top:8px;}.mt10{margin-top:10px;}
.footer{text-align:center;margin-top:18px;font-size:10px;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:6px;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .2s ease;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>

function calcRoute(zones,doms){
  if(!zones||!zones.length)return{go:20,ret:20,total:45};
  var fz=ZONES.find(function(z){return z.key===zones[0];})||{goMins:20,returnMins:20};
  var lz=ZONES.find(function(z){return z.key===zones[zones.length-1];})||{returnMins:20};
  var go=fz.goMins;
  for(var i=1;i<zones.length;i++){
    var f=zones[i-1],t=zones[i];
    go+=(IZ[f]&&IZ[f][t])?IZ[f][t]:12;
  }
  var del=(doms||1)*5,ret=lz.returnMins;
  return{go:go,del:del,ret:ret,total:go+del+ret};
}
function calcProvToClient(provZone,clientZones,doms){
  if(!provZone||!clientZones||!clientZones.length)return calcRoute(clientZones,doms);
  var fz=ZONES.find(function(z){return z.key===clientZones[0];})||{goMins:20};
  var lz=ZONES.find(function(z){return z.key===clientZones[clientZones.length-1];})||{returnMins:20};
  // prov → first client zone
  var p2c=(IZ[provZone]&&IZ[provZone][clientZones[0]])||fz.goMins;
  var between=0;
  for(var i=1;i<clientZones.length;i++){
    var f=clientZones[i-1],t=clientZones[i];
    between+=(IZ[f]&&IZ[f][t])?IZ[f][t]:12;
  }
  return{go:p2c,between:between,del:(doms||1)*5,ret:lz.returnMins,total:p2c+between+(doms||1)*5+lz.returnMins};
}

var K={pwd:'mt_pwd',company:'mt_company',fb:'mt_firebase'};
var DEFAULT_PWD='admin2025';
var view='m',msn='',adminIn=false,adminTab='live',viewDate='';
var fbReady=false,fbDb,fbRef,fbGet,fbSet;
var screen='main';
// Trip config state
var cfg={hasProv:false,provZone:null,clientZones:[],doms:1,photos:[]};
var histFilter={msn:'all',hour:'all'};
var pendingPhotoIdx=null;

function today(){return new Date().toLocaleDateString('en-CA',{timeZone:TZ});}
function nowTime(){return new Date().toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:true});}
function fmtDate(d){var p=d.split('-'),M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return parseInt(p[2])+' '+M[parseInt(p[1])-1]+' '+p[0];}
function ini(n){return n.trim().charAt(0).toUpperCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtSecs(sec){var a=Math.abs(sec),m=Math.floor(a/60),s=a%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function fmtSecsW(sec){var m=Math.floor(sec/60),s=sec%60;return(m>0?m+' min ':'')+s+' seg';}
function elap(ts){return Math.floor((Date.now()-Number(ts))/1000);}
function etaT(mins){return new Date(Date.now()+mins*60000).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:true});}

function tick(){
  var t=new Date().toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  document.getElementById('clk').textContent=t;
  var d=new Date().toLocaleDateString('es-CO',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
  document.getElementById('clk-date').textContent=d.charAt(0).toUpperCase()+d.slice(1);
}
setInterval(tick,1000);tick();

function lsG(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

async function initFB(){
  var c=lsG(K.fb,null);if(!c)return false;
  try{
    var am=await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
    var dm=await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
    var app=am.getApps().length?am.getApps()[0]:am.initializeApp(c);
    fbDb=dm.getDatabase(app);fbRef=dm.ref;fbGet=dm.get;fbSet=dm.set;fbReady=true;
    document.getElementById('store-lbl').textContent='Firebase';
    document.getElementById('store-status').textContent='Firebase activo';
    return true;
  }catch(e){console.error(e);return false;}
}
async function gSt(n){if(fbReady){try{var s=await fbGet(fbRef(fbDb,'mt_states/'+n));return s.val();}catch(e){return null;}}return lsG('mt_st_'+n,null);}
async function sSt(n,d){lsS('mt_st_'+n,d);if(fbReady){try{await fbSet(fbRef(fbDb,'mt_states/'+n),d);}catch(e){}}}
async function gAll(){if(fbReady){try{var s=await fbGet(fbRef(fbDb,'mt_states'));return s.val()||{};}catch(e){return{};}}var o={};MESSENGERS.forEach(function(m){var v=lsG('mt_st_'+m,null);if(v)o[m]=v;});return o;}
async function gHist(date){if(fbReady){try{var s=await fbGet(fbRef(fbDb,'mt_hist/'+date));return s.val()||{};}catch(e){return{};}}return lsG('mt_h_'+date,{});}
async function aHist(date,name,entry){var h=await gHist(date);if(!h[name])h[name]=[];h[name].push(entry);lsS('mt_h_'+date,h);if(fbReady){try{await fbSet(fbRef(fbDb,'mt_hist/'+date),h);}catch(e){}}}
function getPwd(){return lsG(K.pwd,DEFAULT_PWD)||DEFAULT_PWD;}
function getCompany(){return lsG(K.company,'Repuestos Nissan Toyota')||'Repuestos Nissan Toyota';}

function setView(v){
  view=v;
  document.getElementById('tab-m').classList.toggle('active',v==='m');
  document.getElementById('tab-a').classList.toggle('active',v==='a');
  document.getElementById('v-m').style.display=v==='m'?'':'none';
  document.getElementById('v-a').style.display=v==='a'?'':'none';
  if(v==='m')renderM();else renderA();
}

async function renderM(){
  var el=document.getElementById('v-m');
  if(!msn){renderSel(el);return;}
  if(screen==='trip-form'){renderTripForm(el);return;}
  await renderStatus(el);
}

function renderSel(el){
  var g=MESSENGERS.map(function(m){
    return '<button class="msn-btn" onclick="selMsn(\''+m+'\')">'+
      '<div class="mb-av">'+ini(m)+'</div><div class="mb-nm">'+esc(m)+'</div></button>';
  }).join('');
  el.innerHTML='<div class="sel-wrap fi"><h2>Quién eres?</h2><p>Selecciona tu nombre</p><div class="msn-grid">'+g+'</div></div>';
}

async function renderStatus(el){
  var st=await gSt(msn),stk=st?st.state:'libre';
  var SC={
    libre:{lbl:'Libre',sub:'Sin domicilios pendientes',ic:'ic-libre',icon:'ti-home-check',cs:'cs-libre',sb:'sb-libre'},
    a_prov:{lbl:'Al Proveedor',sub:'En camino a recoger repuesto',ic:'ic-proveedor',icon:'ti-building-store',cs:'cs-proveedor',sb:'sb-proveedor'},
    esperando:{lbl:'Esperando despacho',sub:'Proveedor despachando',ic:'ic-esperando',icon:'ti-hourglass',cs:'cs-esperando',sb:'sb-esperando'},
    en_ruta:{lbl:'En Ruta',sub:'Dirigiéndose al cliente',ic:'ic-ruta',icon:'ti-motorbike',cs:'cs-ruta',sb:'sb-ruta'},
    entregando:{lbl:'Entregando',sub:'Realizando entrega',ic:'ic-entregando',icon:'ti-package',cs:'cs-entregando',sb:'sb-entregando'},
    devolviendo:{lbl:'Devolviéndose',sub:'Regresando al almacén',ic:'ic-devolviendo',icon:'ti-arrow-back',cs:'cs-devolviendo',sb:'sb-devolviendo'}
  };
  var c=SC[stk]||SC.libre;
  var tot=st&&st.totalMins?st.totalMins*60:0;
  var isAct=(stk==='en_ruta'||stk==='entregando'||stk==='devolviendo'||stk==='a_prov');
  var el2=isAct&&st&&st.ts?elap(st.ts):0;
  var rem=tot?tot-el2:0;
  var pct=tot?Math.min(100,Math.max(0,(el2/tot)*100)):0;
  var isLate=isAct&&tot&&rem<=-60,isWarn=isAct&&tot&&rem>0&&rem<=120;

  var cdHtml='';
  if(isAct&&st&&st.ts&&tot){
    var tC=isLate?'late':isWarn?'warn':'';
    var pfC=isLate?'pf-late':isWarn?'pf-warn':'pf-ok';
    var tD=rem<=0?('+'+fmtSecs(rem)):fmtSecs(rem);
    cdHtml='<div class="cd-box" id="cd-box" data-ts="'+st.ts+'" data-total="'+tot+'">'+
      '<div class="cd-top"><span class="cd-lbl">'+(rem<=0?'Tiempo excedido':'Tiempo restante')+'</span>'+
      '<span class="cd-time '+tC+'" id="cd-time">'+tD+'</span></div>'+
      '<div class="prog-track"><div class="prog-fill '+pfC+'" id="cd-fill" style="width:'+pct+'%"></div></div></div>';
  }
  var waitHtml='';
  if(stk==='esperando'&&st&&st.waitTs){
    waitHtml='<div class="wait-box"><div class="wait-lbl">Tiempo esperando al proveedor</div>'+
      '<div class="wait-time" id="wt" data-ts="'+st.waitTs+'">'+fmtSecsW(elap(st.waitTs))+'</div></div>';
  }

  var riHtml='';
  if(st&&stk!=='libre'){
    var zD=st.zoneNames||(st.zone?(ZONES.find(function(z){return z.key===st.zone;})||{}).name||'-':'-');
    var etaC=isLate?'c-red':isWarn?'c-orange':'';
    var rows='';
    if(zD&&zD!=='-')rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-map-pin" style="font-size:11px"></i> Zona</span><span class="ri-val c-accent">'+esc(zD)+'</span></div>';
    if(st.doms)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-package" style="font-size:11px"></i> Domicilios</span><span class="ri-val">'+((st.deliveredCount||0)>0?(st.deliveredCount+'/'+st.doms):st.doms+' pendientes')+'</span></div>';
    if(st.provZoneName)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-building-store" style="font-size:11px"></i> Proveedor</span><span class="ri-val c-purple">'+esc(st.provZoneName)+'</span></div>';
    if(st.arrivedProv)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-clock" style="font-size:11px"></i> Llegó prov.</span><span class="ri-val c-purple">'+st.arrivedProv+(st.leftProv?' → '+st.leftProv:' ⏳')+'</span></div>';
    if(st.waitedMins)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-clock" style="font-size:11px"></i> Esperó</span><span class="ri-val">'+st.waitedMins+' min</span></div>';
    if(st.startTime)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-clock" style="font-size:11px"></i> Salió</span><span class="ri-val">'+st.startTime+'</span></div>';
    if(st.etaTime)rows+='<div class="ri-row"><span class="ri-lbl"><i class="ti ti-target" style="font-size:11px"></i> ETA regreso</span><span class="ri-val '+etaC+'">'+st.etaTime+'</span></div>';
    riHtml='<div class="ri-box">'+rows+'</div>';
  }

  // Delivery chips + buttons
  var delHtml='',btns='';
  if(stk==='libre'){
    btns='<button class="btn btn-ruta" onclick="goTripForm()"><i class="ti ti-motorbike"></i> Configurar y salir</button>';

  } else if(stk==='a_prov'){
    btns='<button class="btn btn-esperar" onclick="markEsp()"><i class="ti ti-hourglass"></i> Llegué — Esperando despacho</button>';

  } else if(stk==='esperando'){
    btns='<button class="btn btn-ruta" onclick="markSalidaProv()"><i class="ti ti-motorbike"></i> Ya recogí — En ruta al cliente</button>';

  } else if(stk==='en_ruta'){
    var dC=st?st.deliveredCount||0:0,tD2=st?st.doms||1:1;
    var allD=st&&(st.allDelivered||(dC>=tD2));
    if(allD){
      delHtml='<div class="del-all"><i class="ti ti-checks" style="font-size:16px"></i> Todos los '+tD2+' pedidos entregados</div>';
      btns='<button class="btn btn-volver" onclick="markVolver()"><i class="ti ti-arrow-back"></i> Devolverme al almacén</button>';
    } else {
      var chips='';
      for(var i=0;i<dC;i++){
        var pt=(st.deliveryTimes&&st.deliveryTimes['p'+(i+1)])?(' — '+st.deliveryTimes['p'+(i+1)]):'';
        chips+='<div class="del-chip del-done"><i class="ti ti-circle-check" style="font-size:15px"></i> Pedido '+(i+1)+' entregado'+pt+'</div>';
      }
      var nxt=dC+1,pend=tD2-dC;
      delHtml=chips;
      btns='<button class="btn btn-entrega" onclick="markEntrega('+nxt+')"><i class="ti ti-package"></i> Entregar pedido '+nxt+' de '+tD2+'</button>'+
        (dC>0?'<div style="font-size:11px;color:var(--text3);text-align:center;margin-top:2px">Faltan '+pend+' pedido'+(pend>1?'s':'')+'</div>':'')+
        '<button class="btn btn-cam mt8" onclick="takePhoto('+nxt+')"><i class="ti ti-camera"></i> Foto factura pedido '+nxt+'</button>';
    }

  } else if(stk==='entregando'){
    btns='<button class="btn btn-volver" onclick="markVolver()"><i class="ti ti-arrow-back"></i> Ya entregué — Devolverme</button>';

  } else if(stk==='devolviendo'){
    btns='<button class="btn btn-libre" onclick="markLibre()"><i class="ti ti-home-check"></i> Llegué — Estoy Libre</button>';
  }

  if(isLate&&stk!=='libre'&&stk!=='devolviendo'){
    btns+='<button class="btn btn-ghost" onclick="markLibre()"><i class="ti ti-home-check"></i> Marcar como libre</button>';
  }
  var lateBnr=isLate?'<div class="late-banner"><i class="ti ti-alert-triangle" style="font-size:16px;flex-shrink:0"></i>Llevas '+fmtSecs(rem)+' de retraso</div>':'';

  el.innerHTML=
    '<div class="st-header">'+
      '<div class="st-left"><div class="st-av">'+ini(msn)+'</div>'+
      '<div><div class="st-name">'+esc(msn)+'</div><div class="st-date">'+fmtDate(today())+'</div></div></div>'+
      '<button class="btn-chg" onclick="chgMsn()"><i class="ti ti-refresh" style="font-size:11px"></i> Cambiar</button>'+
    '</div>'+
    '<div class="st-body fi">'+
      '<div class="cur-state '+(isLate?'cs-late':c.cs)+'">'+
        '<div class="cs-l"><div class="cs-ic '+c.ic+'"><i class="ti '+c.icon+'"></i></div>'+
        '<div><div class="cs-lbl">'+c.lbl+'</div><div class="cs-sub">'+c.sub+'</div></div></div>'+
        '<span class="st-badge '+c.sb+'">'+c.lbl.toUpperCase()+'</span>'+
      '</div>'+
      riHtml+cdHtml+waitHtml+delHtml+lateBnr+
      '<div class="act-btns">'+btns+'</div>'+
    '</div>';
}

// ── TRIP FORM ACTIONS ──────────────────────────────────────────────────────
function goTripForm(){cfg={hasProv:false,provZone:null,clientZones:[],doms:1,photos:[]};screen='trip-form';renderM();}
function tglProv(){cfg.hasProv=!cfg.hasProv;if(!cfg.hasProv)cfg.provZone=null;renderM();}
function tglPZ(k){cfg.provZone=cfg.provZone===k?null:k;renderM();}
function tglCZ(k){var i=cfg.clientZones.indexOf(k);if(i>=0)cfg.clientZones.splice(i,1);else cfg.clientZones.push(k);renderM();}
function chgD(d){cfg.doms=Math.max(1,Math.min(10,cfg.doms+d));renderM();}

async function confirmTrip(){
  var hasProv=cfg.hasProv&&cfg.provZone;
  var hasCli=cfg.clientZones.length>0;
  if(!hasProv&&!hasCli){var e=document.getElementById('cf-err');if(e)e.textContent='Selecciona al menos una zona.';return;}
  var now=Date.now();
  var cNames=cfg.clientZones.map(function(k){var z=ZONES.find(function(z){return z.key===k;});return z?z.name:k;}).join(' → ');
  var pz=hasProv?ZONES.find(function(z){return z.key===cfg.provZone;}):null;
  var data;

  if(hasProv&&!hasCli){
    // Only going to provider
    var r2={total:pz.goMins+pz.returnMins};
    data={state:'a_prov',provZone:cfg.provZone,provZoneName:pz.name,
      providerTime:nowTime(),ts:now,totalMins:pz.goMins,
      etaTime:etaT(r2.total),startTime:nowTime(),
      clientZones:[],clientZoneNames:'',doms:cfg.doms};
  } else if(hasProv&&hasCli){
    // Provider first then clients — start by going to provider
    var r3=calcProvToClient(cfg.provZone,cfg.clientZones,cfg.doms);
    data={state:'a_prov',provZone:cfg.provZone,provZoneName:pz.name,
      providerTime:nowTime(),ts:now,totalMins:pz.goMins,
      etaTime:etaT(r3.total),startTime:nowTime(),
      clientZones:cfg.clientZones,clientZoneNames:cNames,
      lastZone:cfg.clientZones[cfg.clientZones.length-1],
      doms:cfg.doms,deliveredCount:0,allDelivered:false,deliveryTimes:{}};
  } else {
    // Only clients
    var r4=calcRoute(cfg.clientZones,cfg.doms);
    data={state:'en_ruta',zones:cfg.clientZones,lastZone:cfg.clientZones[cfg.clientZones.length-1],
      zoneNames:cNames,doms:cfg.doms,deliveredCount:0,allDelivered:false,deliveryTimes:{},
      totalMins:r4.total,ts:now,startTime:nowTime(),etaTime:etaT(r4.total)};
  }
  await sSt(msn,data);
  await aHist(today(),msn,{state:data.state,time:nowTime(),zone:pz?pz.name+' → '+cNames:cNames,doms:cfg.doms,etaTime:data.etaTime});
  screen='main';renderM();
}

// ── STATUS TRANSITIONS ─────────────────────────────────────────────────────
async function markEsp(){
  var st=await gSt(msn)||{};
  var data=Object.assign({},st,{state:'esperando',waitTs:Date.now(),arrivedProv:nowTime()});
  await sSt(msn,data);
  await aHist(today(),msn,{state:'esperando',time:nowTime(),zone:st.provZoneName||''});
  renderM();
}

async function markSalidaProv(){
  var st=await gSt(msn)||{};
  var now=Date.now();
  var ws=st.waitTs?elap(st.waitTs):0;
  var wm=Math.round(ws/60);
  // If has clientZones, go to en_ruta
  if(st.clientZones&&st.clientZones.length>0){
    var r=calcProvToClient(st.provZone,st.clientZones,st.doms||1);
    var data=Object.assign({},st,{
      state:'en_ruta',zones:st.clientZones,lastZone:st.clientZones[st.clientZones.length-1],
      zoneNames:st.clientZoneNames||'',
      ts:now,totalMins:r.go+r.del+r.ret,
      etaTime:etaT(r.go+r.del+r.ret),
      leftProv:nowTime(),waitedMins:wm
    });
    await sSt(msn,data);
    await aHist(today(),msn,{state:'en_ruta',time:nowTime(),zone:st.clientZoneNames||'',note:'Desde proveedor. Esperó '+wm+' min'});
  } else {
    // Just going back
    var pz2=ZONES.find(function(z){return z.key===st.provZone;})||{returnMins:20};
    var data2=Object.assign({},st,{
      state:'devolviendo',ts:now,totalMins:pz2.returnMins,
      etaTime:etaT(pz2.returnMins),leftProv:nowTime(),waitedMins:wm,timeDevolviendo:nowTime()
    });
    await sSt(msn,data2);
    await aHist(today(),msn,{state:'devolviendo',time:nowTime(),note:'Regresa tras proveedor'});
  }
  renderM();
}

async function markEntrega(num){
  var st=await gSt(msn)||{};
  var now=Date.now();
  var nc=(st.deliveredCount||0)+1;
  var dT=st.deliveryTimes||{};
  dT['p'+num]=nowTime();
  var allD=nc>=(st.doms||1);
  var data;
  if(allD){
    var lz=ZONES.find(function(z){return z.key===st.lastZone;})||{returnMins:20};
    data=Object.assign({},st,{deliveredCount:nc,allDelivered:true,deliveryTimes:dT,ts:now,totalMins:lz.returnMins,etaTime:etaT(lz.returnMins)});
  } else {
    data=Object.assign({},st,{deliveredCount:nc,deliveryTimes:dT});
  }
  await sSt(msn,data);
  await aHist(today(),msn,{state:'entregando',time:nowTime(),pedido:num,zone:st.zoneNames||''});
  renderM();
}

async function markVolver(){
  var st=await gSt(msn)||{};
  var now=Date.now();
  var lz=ZONES.find(function(z){return z.key===st.lastZone;})||{returnMins:20};
  var data=Object.assign({},st,{state:'devolviendo',ts:now,totalMins:lz.returnMins,etaTime:etaT(lz.returnMins),timeDevolviendo:nowTime()});
  await sSt(msn,data);
  await aHist(today(),msn,{state:'devolviendo',time:nowTime()});
  renderM();
}

async function markLibre(){
  var st=await gSt(msn)||{};
  var dur=st.startTime?Math.round(elap(st.ts||Date.now())/60):0;
  await aHist(today(),msn,{state:'libre',time:nowTime(),duration:dur});
  await sSt(msn,{state:'libre',ts:Date.now()});
  renderM();
}

function takePhoto(pedidoNum){
  pendingPhotoIdx=pedidoNum;
  document.getElementById('cam-input').click();
}

function handlePhoto(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(e){
    var b64=e.target.result;
    var st=await gSt(msn)||{};
    var photos=st.photos||[];
    photos.push({pedido:pendingPhotoIdx,time:nowTime(),msn:msn,data:b64,date:today()});
    var data=Object.assign({},st,{photos:photos});
    await sSt(msn,data);
    await aHist(today(),msn,{state:'foto',time:nowTime(),pedido:pendingPhotoIdx,photo:b64,msn:msn});
    pendingPhotoIdx=null;
    event.target.value='';
    renderM();
    alert('Foto guardada correctamente.');
  };
  reader.readAsDataURL(file);
}

// ── COUNTDOWN ─────────────────────────────────────────────────────────────
function tickAll(){
  var box=document.getElementById('cd-box');
  if(box){
    var ts=Number(box.dataset.ts||0),tot=Number(box.dataset.total||0);
    if(ts&&tot){
      var e2=elap(ts),r=tot-e2,p=Math.min(100,Math.max(0,(e2/tot)*100));
      var iL=r<=-60,iW=r>0&&r<=120;
      var te=document.getElementById('cd-time'),fe=document.getElementById('cd-fill');
      if(te){te.textContent=r<=0?('+'+fmtSecs(r)):fmtSecs(r);te.className='cd-time'+(iL?' late':iW?' warn':'');}
      if(fe){fe.style.width=p+'%';fe.className='prog-fill '+(iL?'pf-late':iW?'pf-warn':'pf-ok');}
    }
  }
  var wt=document.getElementById('wt');
  if(wt){var wts=Number(wt.dataset.ts||0);if(wts)wt.textContent=fmtSecsW(elap(wts));}
  document.querySelectorAll('[data-ats]').forEach(function(el2){
    var ts=Number(el2.dataset.ats||0),tot=Number(el2.dataset.att||0);
    if(!ts||!tot)return;
    var r=tot-elap(ts),iL=r<=-60,iW=r>0&&r<=120;
    el2.textContent=r<=0?('+'+fmtSecs(r)):fmtSecs(r);
    el2.className='ac-val'+(iL?' c-red':iW?' c-orange':'');
  });
}

            (st&&st.arrivedProv?'<div class="ac-row"><span class="ac-lbl">En proveedor</span><span class="ac-val c-purple">'+st.arrivedProv+(st.leftProv?' → '+st.leftProv:' ⏳')+'</span></div>':'')+
            (st&&st.waitedMins?'<div class="ac-row"><span class="ac-lbl">Esperó</span><span class="ac-val">'+st.waitedMins+' min</span></div>':'')+
            (st&&st.startTime?'<div class="ac-row"><span class="ac-lbl">Salió</span><span class="ac-val">'+st.startTime+'</span></div>':'')+
            (st&&st.timeDevolviendo?'<div class="ac-row"><span class="ac-lbl">Regresando</span><span class="ac-val c-orange">'+st.timeDevolviendo+'</span></div>':'')+
            (st&&st.etaTime?'<div class="ac-row"><span class="ac-lbl">ETA regreso</span><span class="ac-val '+(iL2?'c-red':iW2?'c-orange':'')+'">'+st.etaTime+'</span></div>':'')+
            (tot2?'<div class="ac-row"><span class="ac-lbl">Tiempo</span><span class="ac-val '+(iL2?'c-red':iW2?'c-orange':'')+'" data-ats="'+(st.ts||0)+'" data-att="'+tot2+'">'+tD3+'</span></div>':'')+
            delRows+
          '</div>':'')+
        '</div>';
    }).join('');
    body='<div class="metrics-grid">'+
      '<div class="metric"><div class="metric-n" style="color:var(--green)">'+free+'</div><div class="metric-l">Libres</div></div>'+
      '<div class="metric"><div class="metric-n" style="color:var(--accent)">'+ruta+'</div><div class="metric-l">En Ruta</div></div>'+
      '<div class="metric"><div class="metric-n" style="color:var(--red)">'+late+'</div><div class="metric-l">Atrasados</div></div>'+
      '</div><div class="adm-cards fi">'+cards+'</div>';

  } else if(adminTab==='history'){
    var hist=await gHist(viewDate),isToday=viewDate===today();
    var rows=[];
    var allEntries=[];
    MESSENGERS.forEach(function(m){
      var entries=hist[m]||[];
      entries.forEach(function(e){allEntries.push(Object.assign({},e,{msn:m}));});
    });
    // Filter
    if(histFilter.msn!=='all')allEntries=allEntries.filter(function(e){return e.msn===histFilter.msn;});
    if(histFilter.hour!=='all'){
      allEntries=allEntries.filter(function(e){
        if(!e.time)return false;
        var h=parseInt(e.time.split(':')[0]);
        var ampm=e.time.split(' ')[1];
        var h24=(ampm==='PM'&&h!==12)?h+12:(ampm==='AM'&&h===12?0:h);
        if(histFilter.hour==='morning')return h24>=6&&h24<12;
        if(histFilter.hour==='afternoon')return h24>=12&&h24<18;
        if(histFilter.hour==='evening')return h24>=18||h24<6;
        return true;
      });
    }
    allEntries.forEach(function(e){
      var dur=e.duration?(e.duration+' min'):'-';
      var dC=e.duration&&e.duration>50?'ch-late':e.duration&&e.duration>35?'ch-warn':'ch-ok';
      var stLbl=(e.state||'-').replace('_',' ');
      var photoBtn=e.photo?('<button class="ph-btn" onclick="openPh(\''+e.photo+'\')"><i class="ti ti-photo" style="font-size:11px"></i> Ver</button>'):'';
      rows.push('<tr>'+
        '<td><strong>'+esc(e.msn||'-')+'</strong></td>'+
        '<td><span class="td-chip ch-ok">'+esc(stLbl)+'</span></td>'+
        '<td>'+(e.time||'-')+'</td>'+
        '<td style="font-size:10px">'+esc((e.zone||e.note||'').substring(0,25))+'</td>'+
        '<td>'+(e.state==='libre'?'<span class="td-chip '+dC+'">'+dur+'</span>':e.state==='foto'?photoBtn:'-')+'</td>'+
        '</tr>');
    });
    var msnOpts=MESSENGERS.map(function(m){
      return '<option value="'+m+'"'+(histFilter.msn===m?' selected':'')+'>'+esc(m)+'</option>';
    }).join('');
    body='<div class="hist-wrap fi">'+
      '<div class="date-nav">'+
        '<button class="dnav-btn" onclick="navD(-1)"><i class="ti ti-chevron-left"></i></button>'+
        '<div class="dnav-lbl">'+fmtDate(viewDate)+(isToday?'<span class="today-chip">HOY</span>':'')+'</div>'+
        '<button class="dnav-btn" onclick="navD(1)" '+(isToday?'disabled':'')+'>'+
          '<i class="ti ti-chevron-right"></i></button>'+
      '</div>'+
      '<div class="filter-row">'+
        '<select class="filter-sel" onchange="histFilter.msn=this.value;renderA()">'+
          '<option value="all"'+(histFilter.msn==='all'?' selected':'')+'>Todos los mensajeros</option>'+msnOpts+
        '</select>'+
        '<select class="filter-sel" onchange="histFilter.hour=this.value;renderA()">'+
          '<option value="all"'+(histFilter.hour==='all'?' selected':'')+'>Todas las horas</option>'+
          '<option value="morning"'+(histFilter.hour==='morning'?' selected':'')+'>Mañana (6am-12pm)</option>'+
          '<option value="afternoon"'+(histFilter.hour==='afternoon'?' selected':'')+'>Tarde (12pm-6pm)</option>'+
          '<option value="evening"'+(histFilter.hour==='evening'?' selected':'')+'>Noche (6pm+)</option>'+
        '</select>'+
      '</div>'+
      '<div class="hist-table"><table>'+
        '<thead><tr><th>Mensajero</th><th>Estado</th><th>Hora</th><th>Zona</th><th>Dur./Foto</th></tr></thead>'+
        '<tbody>'+(rows.length?rows.join(''):'<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px">Sin registros</td></tr>')+'</tbody>'+
      '</table></div></div>';

  } else if(adminTab==='settings'){
    var hasFb=!!lsG(K.fb,null);
    var fbHtml=hasFb?
      '<div style="margin-bottom:8px"><span class="connected-badge"><i class="ti ti-check" style="font-size:12px"></i> Firebase conectado</span></div>'+
      '<textarea id="fbt" style="height:70px;font-size:10px;resize:vertical">'+esc(JSON.stringify(lsG(K.fb,{}),null,2))+'</textarea>'
      :'<div class="setup-box">Conecta Firebase para sincronizar entre dispositivos.<br>1. <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a><br>2. Activa <code>Realtime Database</code><br>3. Pega el JSON de config</div>'+
      '<textarea id="fbt" placeholder="{&quot;apiKey&quot;:&quot;...&quot;}" style="height:70px;font-size:10px;resize:vertical"></textarea>';
    body='<div class="set-wrap fi">'+
      '<div class="set-block"><h3><i class="ti ti-building"></i> Empresa</h3>'+
        '<div class="in-row"><input type="text" id="cmp" value="'+esc(getCompany())+'"><button class="btn-ic" onclick="saveCmp()"><i class="ti ti-check"></i></button></div>'+
      '</div>'+
      '<div class="set-block"><h3><i class="ti ti-lock"></i> Contraseña</h3>'+
        '<input type="password" id="np1" placeholder="Nueva contraseña" style="margin-bottom:6px">'+
        '<input type="password" id="np2" placeholder="Confirmar">'+
        '<div id="pmsg" class="ok-msg"></div>'+
        '<button class="btn btn-ruta mt8" onclick="chgPwd()"><i class="ti ti-lock-check"></i> Guardar</button>'+
      '</div>'+
      '<div class="set-block"><h3><i class="ti ti-database"></i> Firebase</h3>'+fbHtml+
        '<button class="btn btn-ghost mt8" onclick="saveFb()"><i class="ti ti-plug"></i> Conectar Firebase</button>'+
      '</div>'+
      '<button class="btn btn-ghost" onclick="doLogout()"><i class="ti ti-logout"></i> Cerrar sesión</button>'+
      '</div>';
  }
  el.innerHTML=bar+body;
}

function doLogin(){var v=(document.getElementById('pin')||{}).value||'';if(v===getPwd()){adminIn=true;renderA();}else{var e=document.getElementById('perr');if(e)e.textContent='Contraseña incorrecta.';}}
function doLogout(){adminIn=false;renderA();}
function setAT(t){adminTab=t;renderA();}
function navD(d){var dt=new Date(viewDate+'T12:00:00');dt.setDate(dt.getDate()+d);var nd=dt.toISOString().split('T')[0];if(nd>today())return;viewDate=nd;renderA();}
function chgPwd(){var p1=(document.getElementById('np1')||{}).value,p2=(document.getElementById('np2')||{}).value,msg=document.getElementById('pmsg');if(!p1||!p2){if(msg){msg.style.color='var(--red)';msg.textContent='Completa ambos campos.';}return;}if(p1!==p2){if(msg){msg.style.color='var(--red)';msg.textContent='No coinciden.';}return;}lsS(K.pwd,p1);if(msg){msg.style.color='var(--green)';msg.textContent='Guardada.';}}
function saveCmp(){var v=(document.getElementById('cmp')||{}).value;if(v&&v.trim()){lsS(K.company,v.trim());document.getElementById('company-sub').textContent=v.trim();renderA();}}
async function saveFb(){var raw=(document.getElementById('fbt')||{}).value||'';try{var cfg2=JSON.parse(raw.trim());lsS(K.fb,cfg2);var ok=await initFB();if(ok){alert('Firebase conectado.');renderA();}else alert('No se pudo conectar.');}catch(e){alert('JSON inválido.');}}

async function init(){
  viewDate=today();
  document.getElementById('company-sub').textContent=getCompany();
  await initFB();
  renderM();
}
init();
</script>
</body>
</html>
