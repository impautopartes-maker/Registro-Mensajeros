<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--bg2:#0d1117;--card:#111820;--card2:#161e28;--border:#1e2d3d;
  --accent:#00d4ff;--a2:#0099cc;--adim:rgba(0,212,255,.08);
  --green:#00ff88;--gdim:rgba(0,255,136,.08);
  --orange:#ff8c00;--odim:rgba(255,140,0,.1);
  --red:#ff3860;--rdim:rgba(255,56,96,.1);
  --yellow:#ffd700;--ydim:rgba(255,215,0,.1);
  --purple:#a855f7;--pdim:rgba(168,85,247,.08);
  --blue:#38bdf8;--bdim:rgba(56,189,248,.08);
  --text:#e8f4ff;--t2:#7a9bb5;--t3:#3d5a70;
  --r:16px;--rs:10px;--rx:7px;
}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:40px 40px;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.o1{width:350px;height:350px;background:radial-gradient(circle,rgba(0,212,255,.07),transparent 70%);top:-60px;right:-60px;}
.o2{width:300px;height:300px;background:radial-gradient(circle,rgba(0,255,136,.05),transparent 70%);bottom:20%;left:-80px;}
.wrap{width:100%;max-width:520px;position:relative;z-index:1;}
.hdr{text-align:center;margin-bottom:20px;padding-top:8px;}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.logo-ic{width:44px;height:44px;background:var(--adim);border:1px solid rgba(0,212,255,.25);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.logo-ic i{font-size:22px;color:var(--accent);}
.logo-t{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.1em;color:var(--text);}
.logo-t span{color:var(--accent);}
.co-sub{font-size:12px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;}
.clk-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.clk-t{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);letter-spacing:.08em;line-height:1;}
.clk-d{font-size:11px;color:var(--t3);margin-top:3px;}
.live{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase;}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:lp 1.5s ease-in-out infinite;}
@keyframes lp{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,136,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(0,255,136,0);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:13px 8px;font-size:12px;font-weight:600;color:var(--t3);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;text-transform:uppercase;letter-spacing:.05em;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}
.sel-wrap{padding:28px 20px;text-align:center;}
.sel-wrap h2{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.08em;color:var(--text);margin-bottom:4px;}
.sel-wrap p{font-size:12px;color:var(--t3);margin-bottom:20px;}
.msn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.msn-btn{padding:14px 10px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .2s;text-align:center;}
.mb-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--bg);margin:0 auto 8px;}
.mb-nm{font-size:13px;font-weight:600;color:var(--text);}
.st-hdr{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.st-l{display:flex;align-items:center;gap:10px;}
.st-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--bg);flex-shrink:0;}
.st-nm{font-size:15px;font-weight:600;color:var(--text);}
.st-dt{font-size:11px;color:var(--t3);margin-top:1px;}
.btn-chg{font-size:11px;color:var(--t3);background:none;border:1px solid var(--border);padding:5px 10px;border-radius:99px;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
.st-body{padding:16px 18px;}
.cur-st{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg2);margin-bottom:12px;transition:all .4s;}
.cs-li{border-color:rgba(0,255,136,.3);background:var(--gdim);}
.cs-pv{border-color:rgba(168,85,247,.3);background:var(--pdim);animation:gp 2s ease-in-out infinite;}
.cs-ep{border-color:rgba(168,85,247,.4);background:var(--pdim);animation:gp 1.5s ease-in-out infinite;}
.cs-ru{border-color:rgba(0,212,255,.3);background:var(--adim);animation:ga 2s ease-in-out infinite;}
.cs-en{border-color:rgba(255,215,0,.3);background:var(--ydim);}
.cs-dv{border-color:rgba(255,140,0,.3);background:var(--odim);}
.cs-la{border-color:rgba(255,56,96,.4);background:var(--rdim);}
.cs-of{border-color:rgba(61,90,112,.4);background:rgba(61,90,112,.08);}
@keyframes ga{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.1)}50%{box-shadow:0 0 16px 3px rgba(0,212,255,.15)}}
@keyframes gp{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,.1)}50%{box-shadow:0 0 16px 3px rgba(168,85,247,.15)}}
.cs-left{display:flex;align-items:center;gap:10px;}
.cs-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.icl{background:var(--gdim);color:var(--green);}
.icp{background:var(--pdim);color:var(--purple);}
.ice{background:var(--pdim);color:var(--purple);}
.icr{background:var(--adim);color:var(--accent);}
.icn{background:var(--ydim);color:var(--yellow);}
.icd{background:var(--odim);color:var(--orange);}
.icof{background:rgba(61,90,112,.15);color:var(--t3);}
.cs-lbl{font-size:16px;font-weight:700;color:var(--text);}
.cs-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.sbadge{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.1em;padding:5px 12px;border-radius:99px;}
.sb-li{background:rgba(0,255,136,.12);color:var(--green);border:1px solid rgba(0,255,136,.2);}
.sb-pv,.sb-ep{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2);}
.sb-ru{background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.2);}
.sb-en{background:rgba(255,215,0,.12);color:var(--yellow);border:1px solid rgba(255,215,0,.2);}
.sb-dv{background:rgba(255,140,0,.12);color:var(--orange);border:1px solid rgba(255,140,0,.2);}
.sb-of{background:rgba(61,90,112,.15);color:var(--t3);border:1px solid rgba(61,90,112,.3);}
.ri-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;}
.ri-row{display:flex;align-items:flex-start;justify-content:space-between;padding:5px 0;gap:8px;}
.ri-row:not(:last-child){border-bottom:1px solid var(--border);}
.ri-l{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ri-v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--text);text-align:right;}
.ca{color:var(--accent);}.cg{color:var(--green);}.co{color:var(--orange);}.cr{color:var(--red);}.cp{color:var(--purple);}
.cd-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;}
.cd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cd-l{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;}
.cd-n{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.05em;color:var(--accent);}
.cd-n.warn{color:var(--orange);}.cd-n.late{color:var(--red);}
.prog{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.pf{height:100%;border-radius:99px;transition:width 1s linear;}
.pok{background:linear-gradient(90deg,var(--accent),var(--green));}.pwn{background:linear-gradient(90deg,var(--orange),var(--yellow));}.plt{background:var(--red);}
.wait-box{background:var(--pdim);border:1px solid rgba(168,85,247,.2);border-radius:var(--rs);padding:14px;margin-bottom:12px;text-align:center;}
.wait-l{font-size:10px;font-weight:600;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.wait-n{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--purple);}
.del-chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--rx);margin-bottom:6px;font-size:12px;font-weight:600;background:var(--gdim);border:1px solid rgba(0,255,136,.2);color:var(--green);}
.del-all{background:var(--gdim);border:1px solid rgba(0,255,136,.2);color:var(--green);border-radius:var(--rx);padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;}
.act-btns{display:flex;flex-direction:column;gap:8px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:var(--rx);font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn:active{transform:scale(.97);}
.b-ru{background:linear-gradient(135deg,var(--accent),var(--a2));color:var(--bg);box-shadow:0 4px 20px rgba(0,212,255,.2);}
.b-pv{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;}
.b-ep{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;}
.b-en{background:linear-gradient(135deg,var(--yellow),#ffaa00);color:var(--bg);}
.b-dv{background:linear-gradient(135deg,var(--orange),#ff6600);color:var(--bg);}
.b-li{background:linear-gradient(135deg,var(--green),#00cc66);color:var(--bg);}
.b-cm{background:linear-gradient(135deg,var(--blue),#0284c7);color:#fff;}
.b-gh{background:var(--card2);color:var(--t2);border:1px solid var(--border);}
.b-of{background:rgba(61,90,112,.2);color:var(--t2);border:1px solid rgba(61,90,112,.4);}
.late-bn{background:var(--rdim);border:1px solid rgba(255,56,96,.3);border-radius:var(--rx);padding:10px 13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--red);}
.fw{padding:16px 18px;}
.flbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block;}
.sec{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:10px;}
.sec.on-p{border-color:rgba(168,85,247,.4);background:var(--pdim);}
.sec.on-r{border-color:rgba(0,212,255,.3);background:var(--adim);}
.sec.on-ph{border-color:rgba(56,189,248,.3);background:var(--bdim);}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-hl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);}
.tog{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--t3);}
.tog.on{background:var(--pdim);border-color:var(--purple);color:var(--purple);}
.zg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.zc{padding:9px 11px;border-radius:var(--rx);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;}
.zc.sc{border-color:var(--accent);background:var(--adim);}
.zc.sp{border-color:var(--purple);background:var(--pdim);}
.zc-n{font-size:11px;font-weight:600;color:var(--text);}
.zc-t{font-size:10px;color:var(--accent);margin-top:1px;font-family:'JetBrains Mono',monospace;}
.zc-t.p{color:var(--purple);}
.dom-ctr{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.dom-b{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);cursor:pointer;font-size:18px;color:var(--t2);display:flex;align-items:center;justify-content:center;}
.dom-n{flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--accent);}
.dom-l{font-size:10px;color:var(--t3);text-align:center;margin-top:-4px;}
.sum-box{background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.15);border-radius:var(--rx);padding:10px 13px;margin-bottom:12px;font-size:12px;color:var(--t2);line-height:1.6;}
.sum-box.has{border-color:rgba(0,212,255,.3);color:var(--text);}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.ph-item{position:relative;border-radius:var(--rx);overflow:hidden;aspect-ratio:1;border:1px solid var(--border);}
.ph-item img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
.ph-del{position:absolute;top:3px;right:3px;background:rgba(255,56,96,.85);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.ph-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);font-size:9px;color:#fff;padding:3px 5px;font-family:'JetBrains Mono',monospace;}
input[type="text"],input[type="password"],textarea,select{width:100%;padding:11px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rx);font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--text);outline:none;display:block;}
input[type="file"]{display:none;}
.adm-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
.atab{padding:11px 12px;font-size:11px;font-weight:600;color:var(--t3);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:4px;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.06em;}
.atab.on{color:var(--accent);border-bottom-color:var(--accent);}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 10px;text-align:center;}
.mn{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;}
.ml{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
.adm-cards{padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.acard{border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg2);overflow:hidden;}
.acard.al{border-color:rgba(0,255,136,.2);}
.acard.ao{border-color:rgba(61,90,112,.3);opacity:.7;}
.acard.ar{border-color:rgba(0,212,255,.25);animation:ga 2.5s ease-in-out infinite;}
.acard.ap,.acard.ae{border-color:rgba(168,85,247,.3);}
.acard.an{border-color:rgba(255,215,0,.2);}
.acard.ad{border-color:rgba(255,140,0,.25);}
.acard.ax{border-color:rgba(255,56,96,.35);}
.ac-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
.ac-l{display:flex;align-items:center;gap:9px;}
.ac-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--bg);flex-shrink:0;}
.ac-nm{font-size:14px;font-weight:700;color:var(--text);}
.ac-sb{font-size:10px;color:var(--t3);margin-top:1px;}
.ac-body{padding:0 14px 12px;}
.ac-row{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 0;border-top:1px solid var(--border);gap:8px;}
.ac-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
.ac-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text);text-align:right;}
.ac-prog{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 4px;}
.ac-pf{height:100%;border-radius:99px;transition:width 1s linear;}
.hw{padding:12px 14px;}
.fr{display:flex;gap:6px;margin-bottom:10px;}
.fr select{flex:1;padding:8px 10px;font-size:12px;}
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.db{width:32px;height:32px;border-radius:var(--rx);border:1px solid var(--border);background:var(--bg2);cursor:pointer;color:var(--t3);font-size:15px;display:flex;align-items:center;justify-content:center;}
.db:disabled{opacity:.3;cursor:not-allowed;}
.dl{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.tday{font-size:9px;background:var(--accent);color:var(--bg);padding:2px 7px;border-radius:99px;font-weight:700;}
.htbl{border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;background:var(--card2);border-bottom:1px solid var(--border);text-align:left;}
td{padding:8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:99px;font-family:'JetBrains Mono',monospace;display:inline-block;}
.cok{background:var(--gdim);color:var(--green);border:1px solid rgba(0,255,136,.2);}
.cwn{background:var(--odim);color:var(--orange);border:1px solid rgba(255,140,0,.2);}
.clt{background:var(--rdim);color:var(--red);border:1px solid rgba(255,56,96,.2);}
.ph-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:99px;background:var(--bdim);border:1px solid rgba(56,189,248,.25);color:var(--blue);font-size:11px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;}
.sw{padding:14px;}
.sblk{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px;}
.sblk h3{font-size:12px;font-weight:700;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em;}
.sblk h3 i{color:var(--accent);}
.cob{display:inline-flex;align-items:center;gap:5px;background:var(--gdim);border:1px solid rgba(0,255,136,.2);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--green);}
.setup-b{background:rgba(0,212,255,.04);border:1.5px dashed rgba(0,212,255,.2);border-radius:var(--rx);padding:12px;margin-bottom:10px;font-size:11px;color:var(--t2);line-height:1.7;}
.setup-b a{color:var(--accent);text-decoration:none;}
.setup-b code{background:var(--card2);padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);}
.ir{display:flex;gap:7px;}.ir input{flex:1;}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
var Kp='mt_pwd',Kc='mt_co',Kf='mt_fb',DPWD='admin2025';
var FB=false,fbDb,fbRef,fbGet,fbSet,fbPush;

function lg(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

async function initFB(){
  var cfg=lg(Kf,null);if(!cfg)return false;
  try{
    var am=await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
    var dm=await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js');
    var app=am.getApps().length?am.getApps()[0]:am.initializeApp(cfg);
    fbDb=dm.getDatabase(app);fbRef=dm.ref;fbGet=dm.get;fbSet=dm.set;fbPush=dm.push;
    FB=true;
    document.getElementById('stlbl').textContent='Firebase';
    document.getElementById('stst').textContent='Firebase activo';
    return true;
  }catch(e){console.error(e);return false;}
}

// State: instant local + async firebase
function gSt(n){return lg('mt_s_'+n,null);}
function sSt(n,d){
  ls('mt_s_'+n,d);
  if(FB)fbSet(fbRef(fbDb,'mt_s/'+n),d).catch(function(){});
}

// History: local + firebase (each entry pushed independently - no overwrite conflicts)
function gH(date){return lg('mt_h_'+date,{});}
function aH(date,name,entry){
  // Save locally (instant)
  var h=gH(date);
  if(!h[name])h[name]=[];
  h[name].push(entry);
  ls('mt_h_'+date,h);
  // Push to Firebase as independent entry (never overwrites others)
  if(FB){
    fbPush(fbRef(fbDb,'mt_h/'+date+'/'+name),entry).catch(function(){});
  }
}

// Photos: stored at mt_photos/[photoId] - separate from history
function savePhoto(b64,cb){
  var id='p'+Date.now();
  // Save locally
  var lp=lg('mt_ph',{});
  lp[id]=b64;
  ls('mt_ph',lp);
  // Save to Firebase separately (photo is small after compression)
  if(FB){
    fbSet(fbRef(fbDb,'mt_photos/'+id),b64)
      .then(function(){cb(id);})
      .catch(function(){cb(id);}); // return id even if FB fails
  } else {
    cb(id);
  }
}
function getPhoto(id,cb){
  var lp=lg('mt_ph',{});
  if(lp[id]){cb(lp[id]);return;}
  if(FB){
    fbGet(fbRef(fbDb,'mt_photos/'+id))
      .then(function(s){
        var v=s.val();
        if(v){var lp2=lg('mt_ph',{});lp2[id]=v;ls('mt_ph',lp2);cb(v);}
        else cb(null);
      }).catch(function(){cb(null);});
  } else {cb(null);}
}

// Fetch all states from Firebase
async function fetchAllStates(){
  if(FB){
    try{
      var s=await fbGet(fbRef(fbDb,'mt_s'));
      var v=s.val()||{};
      Object.keys(v).forEach(function(m){ls('mt_s_'+m,v[m]);});
      return v;
    }catch(e){}
  }
  var o={};CREW.forEach(function(m){var v=lg('mt_s_'+m,null);if(v)o[m]=v;});
  return o;
}
// Fetch history from Firebase - reads push entries and rebuilds local structure
async function fetchHist(date){
  if(FB){
    try{
      var s=await fbGet(fbRef(fbDb,'mt_h/'+date));
      var v=s.val();
      if(v){
        // Convert from push structure {msn: {push_id: entry}} to {msn: [entry, entry]}
        var rebuilt={};
        Object.keys(v).forEach(function(msnKey){
          var msnData=v[msnKey];
          if(msnData && typeof msnData==='object'){
            rebuilt[msnKey]=[];
            Object.keys(msnData).forEach(function(pushId){
              var entry=msnData[pushId];
              if(entry) rebuilt[msnKey].push(entry);
            });
            // Sort by time if possible
            rebuilt[msnKey].sort(function(a,b){
              return (a.time||'').localeCompare(b.time||'');
            });
          }
        });
        ls('mt_h_'+date,rebuilt);
        return rebuilt;
      }
    }catch(e){}
  }
  return gH(date);
}

function today(){return new Date().toLocaleDateString('en-CA',{timeZone:TZ});}
function nowT(){return new Date().toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:true});}
function fmtD(d){var p=d.split('-'),M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return parseInt(p[2])+' '+M[parseInt(p[1])-1]+' '+p[0];}
function ini(n){return n.trim().charAt(0).toUpperCase();}
function xe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fs(s){var a=Math.abs(s),m=Math.floor(a/60),sc=a%60;return(m<10?'0':'')+m+':'+(sc<10?'0':'')+sc;}
function fw(s){var m=Math.floor(s/60),sc=s%60;return(m>0?m+' min ':'')+sc+' seg';}
function seElap(ts){return Math.floor((Date.now()-Number(ts))/1000);}
function etaS(mins){return new Date(Date.now()+mins*60000).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:true});}

// ─── IMAGE COMPRESSION ────────────────────────────────────────────────────────
function compressImg(b64,cb){
  var img=new Image();
  img.onload=function(){
    var mw=800,mh=800,w=img.width,h=img.height;
    if(w>mw){h=Math.round(h*mw/w);w=mw;}
    if(h>mh){w=Math.round(w*mh/h);h=mh;}
    var c=document.createElement('canvas');
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.65));
  };
  img.src=b64;
}

function confTrip(){
  var hp=TRIP.hasProv&&TRIP.pz,hc=TRIP.cz.length>0;
  if(!hp&&!hc){var er=document.getElementById('cferr');if(er)er.textContent='Selecciona al menos una zona.';return;}
  var now=Date.now();
  var cN=TRIP.cz.map(function(k){var z=gz(k);return z?z.n:k;}).join(' → ');
  var pzo=hp?gz(TRIP.pz):null;
  var data;
  if(hp&&!hc){
    data={state:'a_prov',pvZ:TRIP.pz,pvN:pzo.n,pvT:nowT(),ts:now,tM:pzo.g,etaT:etaS(pzo.g+pzo.r),sT:nowT(),cz:[],czN:'',doms:TRIP.doms};
  } else if(hp&&hc){
    var rr=calcPR(TRIP.pz,TRIP.cz,TRIP.doms);
    data={state:'a_prov',pvZ:TRIP.pz,pvN:pzo.n,pvT:nowT(),ts:now,tM:pzo.g,etaT:etaS(rr.total),sT:nowT(),cz:TRIP.cz,czN:cN,lZ:TRIP.cz[TRIP.cz.length-1],doms:TRIP.doms,dC:0,allD:false,dT:{}};
  } else {
    var rr2=calcR(TRIP.cz,TRIP.doms);
    data={state:'en_ruta',zones:TRIP.cz,lZ:TRIP.cz[TRIP.cz.length-1],zN:cN,doms:TRIP.doms,dC:0,allD:false,dT:{},tM:rr2.total,ts:now,sT:nowT(),etaT:etaS(rr2.total)};
  }
  // Save each pre-trip photo separately to Firebase
  var photos=TRIP.photos.slice();
  for(var pi=0;pi<photos.length;pi++){
    (function(p,idx){
      savePhoto(p.b64,function(pid){
        aH(today(),MSN,{state:'foto',time:p.time||nowT(),pedido:idx+1,photoId:pid,msn:MSN,note:'Pre-salida'});
      });
    })(photos[pi],pi);
  }
  sSt(MSN,data);
  aH(today(),MSN,{state:data.state,time:nowT(),zone:pzo?pzo.n+(hc?' → '+cN:''):cN,doms:TRIP.doms,etaT:data.etaT});
  TRIP={hasProv:false,pz:null,cz:[],doms:1,photos:[]};
  SCR='main';rM();
}

// ─── STATE TRANSITIONS ─────────────────────────────────────────────────────────
function mEsp(){
  var st=gSt(MSN)||{};
  sSt(MSN,Object.assign({},st,{state:'esperando',wt:Date.now(),arPv:nowT()}));
  aH(today(),MSN,{state:'esperando',time:nowT(),zone:st.pvN||''});
  rM();
}
function mSalPv(){
  var st=gSt(MSN)||{},now=Date.now();
  var ws=st.wt?seElap(st.wt):0,wm=Math.round(ws/60);
  if(st.pausedZones&&st.pausedZones.length>0){
    var lzo=gz(st.pausedLZ)||{r:20};
    var remD=(st.pausedDoms||1)-(st.pausedDC||0);
    var p2l=(IZ[st.pvZ]&&IZ[st.pvZ][st.pausedLZ])?IZ[st.pvZ][st.pausedLZ]:lzo.r;
    var nt=p2l+remD*5+lzo.r;
    var data=Object.assign({},st,{state:'en_ruta',zones:st.pausedZones,lZ:st.pausedLZ,zN:st.pausedZN,doms:st.pausedDoms,dC:st.pausedDC,dT:st.pausedDT,allD:st.pausedAllD,ts:now,tM:nt,etaT:etaS(nt),lfPv:nowT(),wtM:wm,pausedZones:null,pausedLZ:null,pausedZN:null,pausedDoms:null,pausedDC:null,pausedDT:null,pausedAllD:null});
    sSt(MSN,data);
    aH(today(),MSN,{state:'en_ruta',time:nowT(),zone:st.pausedZN||'',note:'Retoma ruta. Prov: '+st.pvN+' ('+wm+' min)'});
  } else if(st.cz&&st.cz.length>0){
    var rr=calcPR(st.pvZ,st.cz,st.doms||1);
    sSt(MSN,Object.assign({},st,{state:'en_ruta',zones:st.cz,lZ:st.cz[st.cz.length-1],zN:st.czN||'',ts:now,tM:rr.total,etaT:etaS(rr.total),lfPv:nowT(),wtM:wm}));
    aH(today(),MSN,{state:'en_ruta',time:nowT(),zone:st.czN||'',note:'Desde prov. Esperó '+wm+' min'});
  } else {
    var pzo=gz(st.pvZ)||{r:20};
    sSt(MSN,Object.assign({},st,{state:'devolviendo',ts:now,tM:pzo.r,etaT:etaS(pzo.r),lfPv:nowT(),wtM:wm,tDv:nowT()}));
    aH(today(),MSN,{state:'devolviendo',time:nowT(),note:'Regresa tras proveedor'});
  }
  rM();
}
function mEnt(num){
  var st=gSt(MSN)||{},now=Date.now();
  var nc=(st.dC||0)+1,dT=st.dT||{};
  dT['p'+num]=nowT();
  var allD=nc>=(st.doms||1);
  if(allD){var lzo=gz(st.lZ)||{r:20};sSt(MSN,Object.assign({},st,{dC:nc,allD:true,dT:dT,ts:now,tM:lzo.r,etaT:etaS(lzo.r)}));}
  else sSt(MSN,Object.assign({},st,{dC:nc,dT:dT}));
  aH(today(),MSN,{state:'entregando',time:nowT(),pedido:num,zone:st.zN||''});
  rM();
}

  var st=gSt(MSN)||{},now=Date.now();
  var lzo=gz(st.lZ)||{r:20};

// ─── TICK ──────────────────────────────────────────────────────────────────────
function tickAll(){
  var b=document.getElementById('cdb');
  if(b){
    var ts=Number(b.dataset.ts||0),tot=Number(b.dataset.tot||0);
    if(ts&&tot){
      var e2=seElap(ts),r=tot-e2,p=Math.min(100,Math.max(0,(e2/tot)*100));
      var iL=r<=-60,iW=r>0&&r<=120;
      var tn=document.getElementById('cdn'),pf=document.getElementById('cdf');
      if(tn){tn.textContent=r<=0?'+'+fs(r):fs(r);tn.className='cd-n'+(iL?' late':iW?' warn':'');}
      if(pf){pf.style.width=p+'%';pf.className='pf '+(iL?'plt':iW?'pwn':'pok');}
    }
  }
  var w=document.getElementById('wn');
  if(w){var wts=Number(w.dataset.ts||0);if(wts)w.textContent=fw(seElap(wts));}
  document.querySelectorAll('[data-ats]').forEach(function(e2){
    var ts=Number(e2.dataset.ats||0),tot=Number(e2.dataset.att||0);
    if(!ts||!tot)return;
    var r=tot-seElap(ts),iL=r<=-60,iW=r>0&&r<=120;
    e2.textContent=r<=0?'+'+fs(r):fs(r);
    e2.className='ac-val'+(iL?' cr':iW?' co':'');
  });
}

    var MC={offline:'ao',libre:'al',a_prov:'ap',esperando:'ae',en_ruta:'ar',entregando:'an',devolviendo:'ad'};
    var IC={offline:'ti-moon',libre:'ti-home-check',a_prov:'ti-building-store',esperando:'ti-hourglass',en_ruta:'ti-motorbike',entregando:'ti-package',devolviendo:'ti-arrow-back'};
    var LB={offline:'No disponible',libre:'Libre',a_prov:'Al Proveedor',esperando:'Esperando',en_ruta:'En Ruta',entregando:'Entregando',devolviendo:'Devolviéndose'};
    var SB={offline:'sb-of',libre:'sb-li',a_prov:'sb-pv',esperando:'sb-ep',en_ruta:'sb-ru',entregando:'sb-en',devolviendo:'sb-dv'};
    var cards=CREW.map(function(m){
      var st=states[m],stk=st?st.state:'libre';
      var isA=stk==='en_ruta'||stk==='entregando'||stk==='devolviendo'||stk==='a_prov';
      var tot=st&&st.tM?st.tM*60:0;
      var e2=isA&&st&&st.ts?seElap(st.ts):0;
      var r=tot?tot-e2:0,pct=tot?Math.min(100,Math.max(0,(e2/tot)*100)):0;
      var iL=isA&&tot&&r<=-60,iW=isA&&tot&&r>0&&r<=120;
      var pfC=iL?'plt':iW?'pwn':'pok',mcC=iL?'ax':MC[stk]||'al';
      var tD=tot?(r<=0?'+'+fs(r):fs(r)):'-';
      var zD=st&&(st.zN||st.czN||st.pvN)?xe(st.zN||st.czN||st.pvN):'-';
      var dms=st&&st.doms?((st.dC||0)+'/'+st.doms):'-';
      if(stk==='libre'||stk==='offline')free++;else if(stk==='en_ruta')ruta++;
      if(iL)late++;
      var delR='';
      if(st&&st.doms&&st.doms>1){
        for(var pi=1;pi<=st.doms;pi++){
          var pt=st.dT&&st.dT['p'+pi]?st.dT['p'+pi]:null;
          delR+='<div class="ac-row"><span class="ac-lbl">Pedido '+pi+'</span><span class="ac-val '+(pt?'cg':'')+'">'+(pt||'Pendiente')+'</span></div>';
        }
      }
      return '<div class="acard '+mcC+'"><div class="ac-top"><div class="ac-l"><div class="ac-av">'+ini(m)+'</div><div><div class="ac-nm">'+xe(m)+'</div><div class="ac-sb"><i class="ti '+(IC[stk]||'ti-motorbike')+'" style="font-size:10px"></i> '+(LB[stk]||stk)+(st&&st.doms&&stk!=='libre'?' · '+dms+' dom.':'')+'</div></div></div><span class="sbadge '+(SB[stk]||'sb-li')+'" style="font-size:11px">'+(LB[stk]||stk).toUpperCase()+'</span></div>'+(stk!=='libre'?'<div class="ac-body">'+(tot?'<div class="ac-prog"><div class="ac-pf '+pfC+'" style="width:'+pct+'%"></div></div>':'')+'<div class="ac-row"><span class="ac-lbl">Zona</span><span class="ac-val" style="font-size:10px">'+zD+'</span></div>'+(st&&st.pvN?'<div class="ac-row"><span class="ac-lbl">Proveedor</span><span class="ac-val cp">'+xe(st.pvN)+'</span></div>':'')+(st&&st.arPv?'<div class="ac-row"><span class="ac-lbl">En prov.</span><span class="ac-val cp">'+st.arPv+(st.lfPv?' → '+st.lfPv:' ⏳')+'</span></div>':'')+(st&&st.wtM?'<div class="ac-row"><span class="ac-lbl">Esperó</span><span class="ac-val">'+st.wtM+' min</span></div>':'')+(st&&st.sT?'<div class="ac-row"><span class="ac-lbl">Salió</span><span class="ac-val">'+st.sT+'</span></div>':'')+(st&&st.tDv?'<div class="ac-row"><span class="ac-lbl">Regresando</span><span class="ac-val co">'+st.tDv+'</span></div>':'')+(st&&st.etaT?'<div class="ac-row"><span class="ac-lbl">ETA</span><span class="ac-val '+(iL?'cr':iW?'co':'')+'">'+st.etaT+'</span></div>':'')+(tot?'<div class="ac-row"><span class="ac-lbl">Tiempo</span><span class="ac-val '+(iL?'cr':iW?'co':'')+'" data-ats="'+(st.ts||0)+'" data-att="'+tot+'">'+tD+'</span></div>':'')+delR+'</div>':'')+
        '</div>';
    }).join('');
    body='<div class="mg"><div class="metric"><div class="mn" style="color:var(--green)">'+free+'</div><div class="ml">Libres</div></div><div class="metric"><div class="mn" style="color:var(--accent)">'+ruta+'</div><div class="ml">En Ruta</div></div><div class="metric"><div class="mn" style="color:var(--red)">'+late+'</div><div class="ml">Atrasados</div></div></div><div class="adm-cards fi">'+cards+'</div>';

  } else if(ATAB==='history'){
    var hist=await fetchHist(VDATE),isT=VDATE===today();
    var all=[];
    CREW.forEach(function(m){var ents=hist[m]||[];ents.forEach(function(e){all.push(Object.assign({},e,{msn:m}));});});
    if(HFILT.msn!=='all')all=all.filter(function(e){return e.msn===HFILT.msn;});
    if(HFILT.hr!=='all'){
      all=all.filter(function(e){
        if(!e.time)return false;
        var pts=e.time.split(' '),hm=pts[0].split(':'),ap=pts[1]||'';
        var h=parseInt(hm[0]),h24=(ap==='PM'&&h!==12)?h+12:(ap==='AM'&&h===12?0:h);
        if(HFILT.hr==='mo')return h24>=6&&h24<12;
        if(HFILT.hr==='af')return h24>=12&&h24<18;
        if(HFILT.hr==='ev')return h24>=18||h24<6;
        return true;
      });
    }
    // Sort all entries by time (chronological order)
    all.sort(function(a,b){
      var ta=a.time||'', tb=b.time||'';
      // Convert 12h to 24h for correct sorting
      function to24(t){
        if(!t)return 0;
        var pts=t.split(' '),hm=pts[0].split(':'),ap=pts[1]||'';
        var h=parseInt(hm[0]),m=parseInt(hm[1])||0;
        if(ap==='PM'&&h!==12)h+=12;
        if(ap==='AM'&&h===12)h=0;
        return h*60+m;
      }
      return to24(ta)-to24(tb);
    });

    // State colors and icons matching messenger UI
    var SCH={
      libre:      {style:'background:var(--gdim);color:var(--green);border:1px solid rgba(0,255,136,.2)',       icon:'ti-home-check'},
      online:     {style:'background:var(--gdim);color:var(--green);border:1px solid rgba(0,255,136,.2)',       icon:'ti-sun'},
      offline:    {style:'background:rgba(61,90,112,.15);color:var(--t2);border:1px solid rgba(61,90,112,.3)',  icon:'ti-moon'},
      a_prov:     {style:'background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)', icon:'ti-building-store'},
      esperando:  {style:'background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2)', icon:'ti-hourglass'},
      en_ruta:    {style:'background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.2)',   icon:'ti-motorbike'},
      entregando: {style:'background:rgba(255,215,0,.12);color:var(--yellow);border:1px solid rgba(255,215,0,.2)',   icon:'ti-package'},
      devolviendo:{style:'background:rgba(255,140,0,.12);color:var(--orange);border:1px solid rgba(255,140,0,.2)',   icon:'ti-arrow-back'},
      foto:       {style:'background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.25)',   icon:'ti-photo'}
    };

    var rows=all.map(function(e){
      var dur=e.duration?(e.duration+' min'):'-';
      var dc=e.duration&&e.duration>50?'clt':e.duration&&e.duration>35?'cwn':'cok';
      var stKey=(e.state||'libre');
      var stL=stKey.replace(/_/g,' ');
      var sc=SCH[stKey]||SCH.libre;
      var stChip='<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;font-family:JetBrains Mono,monospace;white-space:nowrap;'+sc.style+'"><i class="ti '+sc.icon+'" style="font-size:10px"></i> '+xe(stL)+'</span>';
      var extra;
      if(e.state==='libre'){
        extra='<span class="chip '+dc+'">'+dur+'</span>';
      } else if(e.state==='foto'&&e.photoId){
        var pid=xe(e.photoId);
        extra='<button class="ph-btn" data-pid="'+pid+'" onclick="showPhById(this.dataset.pid)"><i class="ti ti-photo" style="font-size:11px"></i> Ver foto</button>';
      } else {
        extra='-';
      }
      return '<tr><td><strong>'+xe(e.msn||'-')+'</strong></td><td>'+stChip+'</td><td>'+(e.time||'-')+'</td><td style="font-size:10px">'+xe((e.zone||e.note||'').substring(0,25))+'</td><td>'+extra+'</td></tr>';
    });
    var mOpts=CREW.map(function(m){return '<option value="'+m+'"'+(HFILT.msn===m?' selected':'')+'>'+xe(m)+'</option>';}).join('');
    body='<div class="hw fi"><div class="dnav"><button class="db" onclick="navD(-1)"><i class="ti ti-chevron-left"></i></button><div class="dl">'+fmtD(VDATE)+(isT?'<span class="tday">HOY</span>':'')+'</div><button class="db" onclick="navD(1)" '+(isT?'disabled':'')+'>'+
      '<i class="ti ti-chevron-right"></i></button></div>'+
      '<div class="fr"><select onchange="HFILT.msn=this.value;rA()"><option value="all"'+(HFILT.msn==='all'?' selected':'')+'>Todos</option>'+mOpts+'</select>'+
      '<select onchange="HFILT.hr=this.value;rA()"><option value="all"'+(HFILT.hr==='all'?' selected':'')+'>Todas las horas</option><option value="mo"'+(HFILT.hr==='mo'?' selected':'')+'>Mañana 6-12</option><option value="af"'+(HFILT.hr==='af'?' selected':'')+'>Tarde 12-18</option><option value="ev"'+(HFILT.hr==='ev'?' selected':'')+'>Noche 18+</option></select></div>'+
      '<div class="htbl"><table><thead><tr><th>Mensajero</th><th>Estado</th><th>Hora</th><th>Zona</th><th>Dur./Foto</th></tr></thead>'+
      '<tbody>'+(rows.length?rows.join(''):'<tr><td colspan="5" style="text-align:center;color:var(--t3);padding:20px">Sin registros</td></tr>')+'</tbody></table></div></div>';

  } else {
    var hasFb=!!lg(Kf,null);
    var fbH=hasFb?'<div style="margin-bottom:8px"><span class="cob"><i class="ti ti-check" style="font-size:12px"></i> Firebase conectado</span></div><textarea id="fbt" style="height:70px;font-size:10px;resize:vertical">'+xe(JSON.stringify(lg(Kf,{}),null,2))+'</textarea>':
      '<div class="setup-b">Conecta Firebase para sincronizar entre dispositivos.<br>1. <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a><br>2. Activa <code>Realtime Database</code><br>3. Pega el JSON</div>'+
      '<textarea id="fbt" placeholder="{&quot;apiKey&quot;:&quot;...&quot;}" style="height:70px;font-size:10px;resize:vertical"></textarea>';
    body='<div class="sw fi"><div class="sblk"><h3><i class="ti ti-building"></i> Empresa</h3><div class="ir"><input type="text" id="cmp" value="'+xe(getCo())+'"><button class="bic" onclick="saveCo()"><i class="ti ti-check"></i></button></div></div>'+
      '<div class="sblk"><h3><i class="ti ti-lock"></i> Contraseña</h3><input type="password" id="np1" placeholder="Nueva contraseña" style="margin-bottom:6px"><input type="password" id="np2" placeholder="Confirmar"><div id="pmsg" class="ok-msg"></div><button class="btn b-ru mt8" onclick="chgP()"><i class="ti ti-lock-check"></i> Guardar</button></div>'+
      '<div class="sblk"><h3><i class="ti ti-database"></i> Firebase</h3>'+fbH+'<button class="btn b-gh mt8" onclick="saveFb()"><i class="ti ti-plug"></i> Conectar</button></div>'+
      '<button class="btn b-gh" onclick="doOut()"><i class="ti ti-logout"></i> Cerrar sesión</button></div>';
  }
  el.innerHTML=bar+body;
}

function doLog(){var v=(document.getElementById('pin')||{}).value||'';if(v===getPwd()){ADMIN=true;rA();}else{var e=document.getElementById('perr');if(e)e.textContent='Contraseña incorrecta.';}}
function doOut(){ADMIN=false;rA();}
function setAT(t){ATAB=t;rA();}
function navD(d){var dt=new Date(VDATE+'T12:00:00');dt.setDate(dt.getDate()+d);var nd=dt.toISOString().split('T')[0];if(nd>today())return;VDATE=nd;rA();}
function chgP(){var p1=(document.getElementById('np1')||{}).value,p2=(document.getElementById('np2')||{}).value,m=document.getElementById('pmsg');if(!p1||!p2){if(m){m.style.color='var(--red)';m.textContent='Completa ambos campos.';}return;}if(p1!==p2){if(m){m.style.color='var(--red)';m.textContent='No coinciden.';}return;}ls(Kp,p1);if(m){m.style.color='var(--green)';m.textContent='Guardada.';}}
function saveCo(){var v=(document.getElementById('cmp')||{}).value;if(v&&v.trim()){ls(Kc,v.trim());document.getElementById('cosub').textContent=v.trim();rA();}}
async function saveFb(){var raw=(document.getElementById('fbt')||{}).value||'';try{var cfg=JSON.parse(raw.trim());ls(Kf,cfg);var ok=await initFB();if(ok){alert('Firebase conectado.');rA();}else alert('No se pudo conectar.');}catch(e){alert('JSON inválido.');}}

async function init(){
  VDATE=today();
  document.getElementById('cosub').textContent=getCo();
  await initFB();
  rM();
}
init();
</script>
</body>
</html>
